<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="soundboard-head-title"> </title>
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="js/board.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <link
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="node_modules/bootstrap/dist/css/bootstrap-theme.min.css"
      rel="stylesheet"
    />
    <link href="css/custom.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="playlists-column">
        <section class="playlist-panel" id="background-panel">
          <h2>Background music</h2>
          <p class="playlist-hint">Plays one after another. Drag to reorder, double-click a title to jump to it, click the bar to jump inside a track.</p>
          <div class="playlist-toolbar">
            <div class="btn-group" role="group">
              <button
                type="button"
                class="btn btn-primary btn-sm"
                id="bg-play-pause"
                title="Play or pause background music"
                onclick="toggleBackgroundPlayback()"
              >
                <i class="glyphicon glyphicon-play" id="bg-play-icon"></i>
              </button>
              <button
                type="button"
                class="btn btn-default btn-sm"
                id="bg-skip"
                title="Skip to next track"
                onclick="skipBackgroundTrack()"
              >
                <i class="glyphicon glyphicon-step-forward"></i>
              </button>
            </div>
            <label class="playlist-volume">
              <span class="playlist-volume-label">Volume</span>
              <input
                type="range"
                id="bg-master-volume"
                min="0"
                max="100"
                value="70"
                title="Background music volume"
                oninput="setBackgroundMasterVolume(this.value)"
              />
            </label>
          </div>
          <ul id="background-playlist" class="playlist-list"></ul>
        </section>

        <section class="playlist-panel" id="effects-panel">
          <h2>Effects</h2>
          <p class="playlist-hint">Play in parallel. Added at volume 0. Play/stop and endless per effect.</p>
          <div class="playlist-toolbar">
            <label class="playlist-volume playlist-volume-full">
              <span class="playlist-volume-label">Master</span>
              <input
                type="range"
                id="fx-master-volume"
                min="0"
                max="100"
                value="100"
                title="Effects master volume"
                oninput="setEffectsMasterVolume(this.value)"
              />
            </label>
          </div>
          <ul id="effects-playlist" class="playlist-list"></ul>
        </section>
      </aside>

      <main class="library-column">
        <h1 id="soundboard-title"></h1>
        <div id="controls">
          <form class="form-inline">
            <div class="btn-group" role="group">
              <a
                class="btn btn-default"
                id="previous-cat"
                title="Switch to previous category [Arrow left]"
                onclick="previousCat()"
              >
                <i class="glyphicon glyphicon-arrow-left"></i>
              </a>
              <a
                class="btn btn-default"
                title="Switch to next category [Arrow right]"
                id="next-cat"
                onclick="nextCat()"
              >
                <i class="glyphicon glyphicon-arrow-right"></i>
              </a>
            </div>
          </form>
          <div class="form-group" id="search-control">
            <div class="input-group">
              <div class="input-group-addon" title="Search">
                <span class="glyphicon glyphicon-search"> </span>
              </div>
              <input
                type="text"
                title="Search can be focussed with [Alt]"
                class="form-control"
                id="search"
                name="search"
                placeholder="Search..."
              />
            </div>
          </div>
        </div>

        <div id="tabs">
          <ul id="tabs-buttons" class="nav nav-tabs"></ul>
          <div id="tabs-contents" class="tab-content clearfix"></div>
        </div>
        <div id="buttons" class="row"></div>
      </main>
    </div>

    <div
      id="add-sound-modal"
      class="sound-modal"
      aria-hidden="true"
      onclick="onAddSoundModalBackdrop(event)"
    >
      <div class="sound-modal-dialog" role="dialog" aria-modal="true">
        <h3 id="add-sound-modal-title">Add sound</h3>
        <p class="sound-modal-copy">Add this sound to a playlist:</p>
        <div class="sound-modal-actions">
          <button
            type="button"
            class="btn btn-primary"
            id="add-to-background"
            onclick="addPendingToBackground()"
          >
            Background music
          </button>
          <button
            type="button"
            class="btn btn-info"
            id="add-to-effects"
            onclick="addPendingToEffects()"
          >
            Effects
          </button>
          <button
            type="button"
            class="btn btn-default"
            id="add-sound-cancel"
            onclick="closeAddSoundModal()"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
